<aside class="repo-settings-sidebar" aria-label="Repository settings">
    <a class="repo-settings-nav-item{% if settings_section == 'general' %} selected{% endif %}" href="{{ url_prefix }}/{{ owner }}/{{ repo.name }}/settings">
        <span aria-hidden="true">⚙</span> General
    </a>
    <div class="repo-settings-nav-heading">Access</div>
    <a class="repo-settings-nav-item{% if settings_section == 'collaborators' %} selected{% endif %}" href="{{ url_prefix }}/{{ owner }}/{{ repo.name }}/settings/access">Collaborators</a>
    <div class="repo-settings-nav-heading">Code, planning, and automation</div>
    <a class="repo-settings-nav-item{% if settings_section == 'branches' %} selected{% endif %}" href="{{ url_prefix }}/{{ owner }}/{{ repo.name }}/settings/branches">Branches</a>
    <a class="repo-settings-nav-item{% if settings_section == 'actions-runners' %} selected{% endif %}" href="{{ url_prefix }}/{{ owner }}/{{ repo.name }}/settings/actions/runners">Actions runners</a>
    <span class="repo-settings-nav-item disabled">Webhooks</span>
    <div class="repo-settings-nav-heading">Security</div>
    <span class="repo-settings-nav-item disabled">Secrets and variables</span>
    <div class="repo-settings-nav-heading repo-settings-nav-divider">Integrations</div>
    <a class="repo-settings-nav-item{% if settings_section == 'github-apps' %} selected{% endif %}" href="{{ url_prefix }}/{{ owner }}/{{ repo.name }}/settings/installations">GitHub Apps</a>
    <span class="repo-settings-nav-item disabled">Email notifications</span>
</aside>
