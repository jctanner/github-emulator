version: "3.8"

services:
  github-emulator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "443:443"
      - "80:80"
      - "${PORT:-8000}:8000"
      - "${GITHUB_EMULATOR_SSH_PORT_HOST:-2222}:2222"
    volumes:
      - github_emulator_data:/data
    environment:
      - GITHUB_EMULATOR_DATA_DIR=/data
      - GITHUB_EMULATOR_DATABASE_URL=sqlite+aiosqlite:////data/github_emulator.db
      - GITHUB_EMULATOR_BASE_URL=https://ghemu.local
      - GITHUB_EMULATOR_HOSTNAME=ghemu.local
      - GITHUB_EMULATOR_SECRET_KEY=change-me-in-production
      - GITHUB_EMULATOR_ADMIN_USERNAME=admin
      - GITHUB_EMULATOR_ADMIN_PASSWORD=admin
      - GITHUB_EMULATOR_SSH_ENABLED=true
      - GITHUB_EMULATOR_SSH_PORT=2222
      - GITHUB_EMULATOR_APP_JWT_PERMISSIVE=${GITHUB_EMULATOR_APP_JWT_PERMISSIVE:-true}
    restart: unless-stopped

  actions-runner:
    build:
      context: ./src/runners/emulator
      dockerfile: Dockerfile
    environment:
      - GITHUB_EMULATOR_URL=https://github-emulator
      - GITHUB_EMULATOR_TOKEN=${GITHUB_EMULATOR_RUNNER_TOKEN:-}
      - RUNNER_SCOPE=${RUNNER_SCOPE:-repository}
      - RUNNER_REPO=${RUNNER_REPO:-admin/test-repo}
      - RUNNER_NAME=${RUNNER_NAME:-docker-runner-1}
      - RUNNER_LABELS=${RUNNER_LABELS:-self-hosted,linux}
    depends_on:
      - github-emulator
    restart: unless-stopped

  actions-real-runner:
    profiles:
      - real-runner
    container_name: ${ACTIONS_REAL_RUNNER_CONTAINER_NAME:-ghemu-actions-real-runner-test}
    build:
      context: ./src/runners/upstream
      dockerfile: Dockerfile
      args:
        RUNNER_VERSION: ${ACTIONS_RUNNER_VERSION:-2.317.0}
    environment:
      - GITHUB_EMULATOR_URL=http://github-emulator:8000
      - GITHUB_EMULATOR_TOKEN=${GITHUB_EMULATOR_RUNNER_TOKEN:-}
      - RUNNER_REPO=${RUNNER_REPO:-admin/test-repo}
      - RUNNER_NAME=real-runner-1
      - RUNNER_LABELS=self-hosted,linux
    depends_on:
      - github-emulator
    restart: "no"

volumes:
  github_emulator_data:
