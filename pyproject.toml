[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-emulator"
version = "0.1.0"
description = "A GitHub-compatible API emulator for integration testing"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.1.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "python-jose[cryptography]>=3.3.0",
    "strawberry-graphql[fastapi]>=0.217.0",
    "httpx>=0.26.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.6",
    "asyncssh>=2.14.0",
    # Actions secrets are libsodium sealed boxes on GitHub; the emulator
    # generates the repository public key and opens what clients seal to it.
    "pynacl>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "honcho>=2.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
extend-exclude = ["src/frontend"]

[tool.ruff.lint]
# Enforced on the files a change touches (pre-commit and CI run on the diff
# against main), so the set is one a contributor can meet in a file they
# edit: pyflakes, syntax-level pycodestyle, import order, bugbear and bandit.
select = ["E4", "E7", "E9", "F", "I", "B", "S"]
ignore = [
    "E501",  # long lines: no formatter yet
    "B008",  # FastAPI's Depends()/Query() defaults are the framework's idiom
    "S104",  # binding 0.0.0.0 is how the emulator is reached in a container
    "S603",  # running git is this emulator's job; arguments are lists, no shell
    "S607",  # likewise: git and caddy are found on PATH by design
    "E712",  # SQLAlchemy filters need `column == True`, not `is True`
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use fixed fake credentials and temp paths on purpose.
"tests/**" = ["S101", "S105", "S106", "S108", "S311"]
# Strawberry resolves these string annotations itself (lazy forward types).
"src/app/graphql/types/**" = ["F821"]
# The expression lexer compares a variable named `token` with literals.
"src/runners/emulator/runner.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
