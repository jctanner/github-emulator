name: GitHub release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: published-image-*
          path: published-images
      - name: Release only after the image was smoke-tested and published
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const images = fs.readdirSync('published-images').sort().map(directory =>
              fs.readFileSync(`published-images/${directory}/image.txt`, 'utf8').trim());
            if (!images.length || images.some(image => !/^ghcr\.io\/[^\s]+@sha256:[a-f0-9]{64}$/.test(image))) {
              throw new Error('Published image digests are missing or invalid');
            }
            const tag = context.ref.replace('refs/tags/', '');
            if (!context.ref.startsWith('refs/tags/')) {
              throw new Error('Releases require a tag');
            }
            const {owner, repo} = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({owner, repo, tag});
              throw new Error('Release already exists; releases are immutable');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const {data: notes} = await github.rest.repos.generateReleaseNotes({owner, repo, tag_name: tag});
            await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: tag, draft: false, prerelease: false,
              body: `${notes.body}\n\nSource commit: ${context.sha}\n\nContainers:\n${images.map(image => `- \`${image}\``).join("\n")}`,
              make_latest: 'true'
            });
