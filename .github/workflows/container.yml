name: Container image

on:
  push:
    branches: [main]
    tags: ["20[0-9][0-9].[0-9][0-9].[0-9][0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            port: 8000
            dockerfile: Dockerfile
            image: ghcr.io/${{ github.repository }}
          - variant: k3s
            port: 80
            dockerfile: Dockerfile.k3s
            image: ghcr.io/${{ github.repository }}-k3s
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release_version.py "$GITHUB_REF_NAME"
      - name: Publication policy regression tests
        run: python3 -m unittest discover -s scripts -p test_publish_image.py -v
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
            type=ref,event=pr
      - name: Build once for smoke testing and publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: release-smoke:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Smoke test
        env:
          VARIANT: ${{ matrix.variant }}
          CONTAINER_PORT: ${{ matrix.port }}
        run: |
          extra=()
          if [[ "$VARIANT" == k3s ]]; then
            printf ':80 {\n  reverse_proxy 127.0.0.1:8000\n}\n' > smoke.Caddyfile
            chmod 644 smoke.Caddyfile
            extra=(-v "$PWD/smoke.Caddyfile:/etc/caddy/Caddyfile:ro")
          fi
          docker run -d --name release-smoke -p "127.0.0.1:8080:$CONTAINER_PORT" "${extra[@]}" release-smoke:local
          for _ in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:8080/api/v3 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs release-smoke || true
          docker rm -f release-smoke || true
      - if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        id: publish
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_REPOSITORY: ${{ matrix.image }}
        run: bash scripts/publish_image.sh
      - name: Record published image
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: published-image-${{ matrix.variant }}
          path: image.txt
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: image
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
