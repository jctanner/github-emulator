# Weekly dependency updates. The cooldown holds a release back for 14 days,
# so a compromised or broken release has time to be pulled before it lands
# here. Minor and patch updates come grouped; majors come one by one.
# pre-commit hook revisions are not covered: `pre-commit autoupdate --freeze`.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/frontend
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 14}

  - package-ecosystem: docker
    # The emulator images.
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 14}

  - package-ecosystem: docker
    # The two runner images track GitHub's hosted ubuntu-24.04 workers, so
    # the base stays on 24.04: no interim releases (24.10, 25.10), and no
    # next LTS (26.04) either. Moving the base is a deliberate change: the
    # upstream image's libicu74 pin (the 24.04 package name) has to move
    # with it, and both runners have to be built and exercised, since CI
    # builds neither image.
    directories: ["/src/runners/emulator", "/src/runners/upstream"]
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    ignore:
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
